<form
    id="contactForm"
    class="contact-form"
    method="post"
    novalidate
>
    <!-- ==================================================
         FORM SOURCE
         This value will be updated automatically by JS.
    ================================================== -->

    <input
        type="hidden"
        name="form_source"
        id="formSource"
        value="website"
    >

    <div
        class="form-honeypot"
        aria-hidden="true"
    >
        <label for="website">
            Website
        </label>
        <input
            type="text"
            id="website"
            name="website"
            tabindex="-1"
            autocomplete="off"
        >
    </div>
    <!-- ==================================================
         NAME
    ================================================== -->

    <div class="form-row">

        <div class="form-group">
            <label for="firstName">
                名
                <span aria-hidden="true">*</span>
            </label>
            <input
                type="text"
                id="firstName"
                name="first_name"
                autocomplete="given-name"
                maxlength="100"
                required
            >
        </div>

        <div class="form-group">
            <label for="lastName">
                姓
                <span aria-hidden="true">*</span>
            </label>
            <input
                type="text"
                id="lastName"
                name="last_name"
                autocomplete="family-name"
                maxlength="100"
                required
            >
        </div>

    </div>

    <!-- ==================================================
         EMAIL / PHONE
    ================================================== -->

    <div class="form-row">

        <div class="form-group">
            <label for="email">
                电子邮箱
                <span aria-hidden="true">*</span>
            </label>
            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                maxlength="254"
                required
            >
        </div>

        <div class="form-group">
            <label for="phone">
                电话号码
            </label>
            <input
                type="tel"
                id="phone"
                name="phone"
                autocomplete="tel"
                maxlength="50"
            >
        </div>

    </div>

    <!-- ==================================================
         CITIZENSHIP / RESIDENCE
    ================================================== -->

    <div class="form-row">

        <div class="form-group">
            <label for="citizenship">
                国籍
            </label>
            <input
                type="text"
                id="citizenship"
                name="citizenship"
                autocomplete="country-name"
                maxlength="100"
            >
        </div>

        <div class="form-group">
            <label for="residence">
                当前居住国家
            </label>
            <input
                type="text"
                id="residence"
                name="residence"
                autocomplete="country-name"
                maxlength="100"
            >
        </div>

    </div>

    <!-- ==================================================
         SERVICE
    ================================================== -->

    <div class="form-group">
        <label for="service">
            您希望咨询哪项服务？
            <span aria-hidden="true">*</span>
        </label>
        <select
            id="service"
            name="service"
            required
        >
            <option value="">
                请选择服务
            </option>

            <optgroup label="移民">
                <option value="Permanent Residence">
                    Permanent Residence
                </option>
                <option value="Canadian Experience Class">
                    Canadian Experience Class
                </option>
                <option value="Federal Skilled Worker Program">
                    Federal Skilled Worker Program
                </option>
                <option value="Federal Skilled Trades Program">
                    Federal Skilled Trades Program
                </option>
                <option value="Provincial Nominee Program">
                    Provincial Nominee Program
                </option>
            </optgroup>

            <optgroup label="家庭团聚">
                <option value="Spousal Sponsorship">
                    Spousal Sponsorship
                </option>
                <option value="Common-Law Partner Sponsorship">
                    Common-Law Partner Sponsorship
                </option>
                <option value="Conjugal Partner Sponsorship">
                    Conjugal Partner Sponsorship
                </option>
                <option value="Same-Sex Sponsorship">
                    Same-Sex Sponsorship
                </option>
                <option value="Dependent Child Sponsorship">
                    Dependent Child Sponsorship
                </option>
                <option value="Parents and Grandparents Sponsorship">
                    Parents and Grandparents Sponsorship
                </option>
                <option value="Super Visa">
                    Super Visa
                </option>
            </optgroup>

            <optgroup label="工作">
                <option value="Work Permit">
                    Work Permit
                </option>
                <option value="Spousal Open Work Permit">
                    Spousal Open Work Permit
                </option>
                <option value="Post-Graduation Work Permit">
                    Post-Graduation Work Permit (PGWP)
                </option>
                <option value="Bridging Open Work Permit">
                    Bridging Open Work Permit (BOWP)
                </option>
                <option value="Vulnerable Worker Open Work Permit">
                    Vulnerable Worker Open Work Permit
                </option>
                <option value="Extend or Change Work Permit">
                    Extend or Change Work Permit
                </option>
                <option value="LMIA for Employers">
                    LMIA for Employers
                </option>
                <option value="LMIA-Based Work Permit">
                    LMIA-Based Work Permit
                </option>
            </optgroup>

            <optgroup label="留学">
                <option value="Study Permit">
                    Study Permit
                </option>
                <option value="Study Permit Extension">
                    Study Permit Extension
                </option>
            </optgroup>

            <optgroup label="访问">
                <option value="Visitor Visa">
                    Visitor Visa
                </option>
                <option value="Extend Your Stay">
                    Extend Your Stay in Canada
                </option>
            </optgroup>

            <optgroup label="身份与入籍">
                <option value="Maintained Status">
                    Maintained Status
                </option>
                <option value="Restoration of Temporary Status">
                    Restoration of Temporary Status
                </option>
                <option value="PR Card Renewal or Replacement">
                    PR Card Renewal or Replacement
                </option>
                <option value="Permanent Resident Travel Document">
                    Permanent Resident Travel Document (PRTD)
                </option>
                <option value="Canadian Citizenship">
                    Canadian Citizenship
                </option>
            </optgroup>

            <optgroup label="其他">
                <option value="Other Immigration Matter">
                    Other Immigration Matter
                </option>
            </optgroup>
        </select>
    </div>

    <!-- ==================================================
         REFERRAL SOURCE
    ================================================== -->

    <div class="form-group">
        <label for="referral">
            您是如何了解到我们的？
        </label>
        <select
            id="referral"
            name="referral"
        >
            <option value="">
                请选择
            </option>
            <option value="Friend or Family">
                Friend or Family
            </option>
            <option value="Google Search">
                Google Search
            </option>
            <option value="WeChat">
                WeChat
            </option>
            <option value="Xiaohongshu">
                Xiaohongshu
            </option>
            <option value="Social Media">
                Other Social Media
            </option>
            <option value="Previous Client">
                Previous Client
            </option>
            <option value="Other">
                其他
            </option>
        </select>
    </div>

    <!-- ==================================================
         CASE SUMMARY
    ================================================== -->

    <div class="form-group">
        <label for="caseSummary">
            请简要介绍您的情况
            <span aria-hidden="true">*</span>
        </label>
        <textarea
            id="caseSummary"
            name="case_summary"
            rows="7"
            maxlength="5000"
            required
            placeholder="请简要说明您的移民情况、目标以及任何重要的截止日期。"
        ></textarea>
    </div>

    <!-- ==================================================
         PRIVACY NOTICE
    ================================================== -->

    <div class="form-privacy-note">
        <p>
            请勿通过此一般咨询表提交护照号码、UCI 号码、
            社会保险号码（SIN）、银行信息、密码或其他
            非必要的敏感个人信息。
        </p>
        <p>
            提交此表格并不代表您与
            AddPlus Immigration Solutions Inc.
            建立了顾问与客户关系。
        </p>
        <p>
            提交此表格即表示您知悉，我们可能会根据我们的
            <a data-root-href="zh/privacy-policy.html">
                隐私政策
            </a>.
        </p>
    </div>

    <!-- ==================================================
         FUTURE TURNSTILE LOCATION

         When we connect Cloudflare Turnstile later,
         it will be inserted here.
    ================================================== -->

    <div
        id="turnstileContainer"
        class="turnstile-container"
        data-sitekey="0x4AAAAAAEnwrd1pAy72snks"
    ></div>

    <!-- ==================================================
         SUBMIT
    ================================================== -->

    <button
        type="submit"
        class="button primary-button"
    >
        提交咨询
    </button>

    <div
        id="formMessage"
        class="form-message"
        role="status"
        aria-live="polite"
    ></div>

</form>
