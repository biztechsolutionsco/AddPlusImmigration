<form
    id="contactForm"
    class="contact-form"
    method="post"
    novalidate
>
    <!-- ==================================================
         FORM SOURCE
         This value will be updated automatically by JS.
    ================================================== -->

    <input
        type="hidden"
        name="form_source"
        id="formSource"
        value="website"
    >

    <div
        class="form-honeypot"
        aria-hidden="true"
    >
        <label for="website">
            Website
        </label>
        <input
            type="text"
            id="website"
            name="website"
            tabindex="-1"
            autocomplete="off"
        >
    </div>
    <!-- ==================================================
         NAME
    ================================================== -->

    <div class="form-row">

        <div class="form-group">
            <label for="firstName">
                名
                <span aria-hidden="true">*</span>
            </label>
            <input
                type="text"
                id="firstName"
                name="first_name"
                autocomplete="given-name"
                maxlength="100"
                required
            >
        </div>

        <div class="form-group">
            <label for="lastName">
                姓
                <span aria-hidden="true">*</span>
            </label>
            <input
                type="text"
                id="lastName"
                name="last_name"
                autocomplete="family-name"
                maxlength="100"
                required
            >
        </div>

    </div>

    <!-- ==================================================
         EMAIL / PHONE
    ================================================== -->

    <div class="form-row">

        <div class="form-group">
            <label for="email">
                电子邮箱
                <span aria-hidden="true">*</span>
            </label>
            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                maxlength="254"
                required
            >
        </div>

        <div class="form-group">
            <label for="phone">
                电话号码
            </label>
            <input
                type="tel"
                id="phone"
                name="phone"
                autocomplete="tel"
                maxlength="50"
            >
        </div>

    </div>

    <!-- ==================================================
         CITIZENSHIP / RESIDENCE
    ================================================== -->

    <div class="form-row">

        <div class="form-group">
            <label for="citizenship">
                国籍
            </label>
            <input
                type="text"
                id="citizenship"
                name="citizenship"
                autocomplete="country-name"
                maxlength="100"
            >
        </div>

        <div class="form-group">
            <label for="residence">
                当前居住国家
            </label>
            <input
                type="text"
                id="residence"
                name="residence"
                autocomplete="country-name"
                maxlength="100"
            >
        </div>

    </div>

    <!-- ==================================================
         SERVICE
    ================================================== -->

    <div class="form-group">
        <label for="service">
            您希望咨询哪项服务？
            <span aria-hidden="true">*</span>
        </label>
        <select
            id="service"
            name="service"
            required
        >
            <option value="">
                请选择服务
            </option>

            <optgroup label="移民">
                <option value="Permanent Residence">
                    加拿大永久居民身份
                </option>
                <option value="Canadian Experience Class">
                    加拿大经验类（CEC）
                </option>
                <option value="Federal Skilled Worker Program">
                    联邦技术移民（FSWP）
                </option>
                <option value="Federal Skilled Trades Program">
                    联邦技工类（FSTP）
                </option>
                <option value="Provincial Nominee Program">
                    省提名计划（PNP）
                </option>
            </optgroup>

            <optgroup label="家庭团聚">
                <option value="Spousal Sponsorship">
                    配偶担保
                </option>
                <option value="Common-Law Partner Sponsorship">
                    同居伴侣担保
                </option>
                <option value="Conjugal Partner Sponsorship">
                    婚姻伴侣担保
                </option>
                <option value="Same-Sex Sponsorship">
                    同性伴侣担保
                </option>
                <option value="Dependent Child Sponsorship">
                    受抚养子女担保
                </option>
                <option value="Parents and Grandparents Sponsorship">
                    父母及祖父母担保
                </option>
                <option value="Super Visa">
                    超级签证
                </option>
            </optgroup>

            <optgroup label="工作">
                <option value="Work Permit">
                    工作许可
                </option>
                <option value="Spousal Open Work Permit">
                    配偶开放式工签
                </option>
                <option value="Post-Graduation Work Permit">
                    毕业后工作许可（PGWP）
                </option>
                <option value="Bridging Open Work Permit">
                    桥梁开放式工签（BOWP）
                </option>
                <option value="Vulnerable Worker Open Work Permit">
                    弱势劳工开放式工签
                </option>
                <option value="Extend or Change Work Permit">
                    工签延期
                </option>
                <option value="LMIA for Employers">
                    雇主 LMIA 申请
                </option>
                <option value="LMIA-Based Work Permit">
                    基于 LMIA 的工签
                </option>
            </optgroup>

            <optgroup label="留学">
                <option value="Study Permit">
                    学签申请
                </option>
                <option value="Study Permit Extension">
                    学签延期
                </option>
            </optgroup>

            <optgroup label="访问">
                <option value="Visitor Visa">
                    访客签证
                </option>
                <option value="Extend Your Stay">
                    延长在加拿大的停留
                </option>
            </optgroup>

            <optgroup label="身份与入籍">
                <option value="Maintained Status">
                    维持身份
                </option>
                <option value="Restoration of Temporary Status">
                    临时居民身份恢复
                </option>
                <option value="PR Card Renewal or Replacement">
                    永久居民卡（PR Card）
                </option>
                <option value="Permanent Resident Travel Document">
                    永久居民旅行证件（PRTD）
                </option>
                <option value="Canadian Citizenship">
                    加拿大入籍
                </option>
            </optgroup>

            <optgroup label="其他">
                <option value="Other Immigration Matter">
                    其他移民事务
                </option>
            </optgroup>
        </select>
    </div>

    <!-- ==================================================
         REFERRAL SOURCE
    ================================================== -->

    <div class="form-group">
        <label for="referral">
            您是如何了解到我们的？
        </label>
        <select
            id="referral"
            name="referral"
        >
            <option value="">
                请选择
            </option>
            <option value="Friend or Family">
                朋友或家人推荐
            </option>

            <option value="Google Search">
                Google 搜索
            </option>

            <option value="WeChat">
                微信
            </option>

            <option value="Xiaohongshu">
                小红书
            </option>

            <option value="Social Media">
                其他社交媒体
            </option>

            <option value="Previous Client">
                曾使用过我们的服务
            </option>

            <option value="Other">
                其他
            </option>
        </select>
    </div>

    <!-- ==================================================
         CASE SUMMARY
    ================================================== -->

    <div class="form-group">
        <label for="caseSummary">
            请简要介绍您的情况
            <span aria-hidden="true">*</span>
        </label>
        <textarea
            id="caseSummary"
            name="case_summary"
            rows="7"
            maxlength="5000"
            required
            placeholder="请简要说明您的移民情况、目标以及任何重要的截止日期。"
        ></textarea>
    </div>

    <!-- ==================================================
         PRIVACY NOTICE
    ================================================== -->

    <div class="form-privacy-note">
        <p>
            请勿通过此一般咨询表提交护照号码、UCI 号码、
            社会保险号码（SIN）、银行信息、密码或其他
            非必要的敏感个人信息。
        </p>
        <p>
            提交此表格并不代表您与
            AddPlus Immigration Solutions Inc.
            建立了顾问与客户关系。
        </p>
        <p>
            提交此表格即表示您知悉，我们可能会根据我们的
            <a data-root-href="zh/privacy-policy.html">
                隐私政策
            </a>
            收集、使用和处理您提供的信息。
        </p>
    </div>

    <!-- ==================================================
         FUTURE TURNSTILE LOCATION

         When we connect Cloudflare Turnstile later,
         it will be inserted here.
    ================================================== -->

    <div
        id="turnstileContainer"
        class="turnstile-container"
        data-sitekey="0x4AAAAAAEnwrd1pAy72snks"
    ></div>

    <!-- ==================================================
         SUBMIT
    ================================================== -->

    <button
        type="submit"
        class="button primary-button"
    >
        提交咨询
    </button>

    <div
        id="formMessage"
        class="form-message"
        role="status"
        aria-live="polite"
    ></div>

</form>
